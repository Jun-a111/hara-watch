<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111b"><title>GACHA WARS — ソシャゲ勢力戦</title><style>
:root{--bg:#07101b;--pane:#101e2d;--pane2:#142639;--bd:#294054;--muted:#91a6b9;--fg:#eaf2fa;--gold:#fbc86c;--blue:#6dd5ff;--green:#5ce3b7;--red:#ff849a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 100% 400px at 65% -50px,#173655 0,transparent 80%),var(--bg);color:var(--fg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--blue)}.shell{max-width:1220px;margin:auto;padding:22px 18px 70px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand small{letter-spacing:.25em;color:var(--blue);font-weight:800;font-size:10px}.brand h1{font-size:clamp(29px,5vw,46px);letter-spacing:-.05em;margin:2px 0}.brand h1 b{color:var(--gold)}.stamp{font-size:12px;color:var(--muted);text-align:right}.intro{margin:10px 0 22px;color:#b7c9d8;font-size:13px;line-height:1.7}.nav{display:flex;overflow:auto;gap:8px;padding:0 0 14px;scrollbar-width:thin}.nav button,.pill{white-space:nowrap;background:var(--pane);color:var(--muted);border:1px solid var(--bd);border-radius:9px;padding:10px 13px;font-weight:750}.nav button.on,.pill.on{color:#091421;background:var(--gold);border-color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:19px}.card{background:linear-gradient(150deg,#142439,#0e1b2a);border:1px solid var(--bd);border-radius:14px;padding:17px}.stat label{font-size:11px;color:var(--muted);display:block}.stat strong{font-size:27px;display:block;margin-top:6px;letter-spacing:-.04em}.stat em{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-style:normal}.panel{border:1px solid var(--bd);background:rgba(14,29,44,.85);border-radius:15px;padding:19px;margin-top:16px}.panel h2{font-size:18px;margin:0 0 6px}.hint{color:var(--muted);font-size:12px;line-height:1.65;margin:0 0 17px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.space{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.game{border:1px solid #30495e;background:#102439;border-radius:12px;padding:15px;position:relative;min-height:140px}.game:hover{border-color:#6c97b6}.game .ico{font-size:26px}.game h3{font-size:16px;margin:10px 0 5px}.game small{color:var(--muted)}.game .code{position:absolute;right:12px;top:13px;font-size:10px;color:#7eafca}.tag{font-size:10px;border:1px solid var(--bd);border-radius:5px;padding:3px 6px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 18px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 9px;border-bottom:1px solid #273e50;text-align:left}th{color:var(--muted);font-size:11px;font-weight:750}td .tiny{font-size:11px;color:var(--muted)}.empty{color:#91a6b9}.rank{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}.scroll{overflow:auto}.btn{border:1px solid #47627a;background:#1b354e;color:#eaf2fa;border-radius:9px;padding:10px 13px;font-weight:700}.btn:hover{background:#284862}.btn.gold{background:var(--gold);border-color:var(--gold);color:#101921}.forms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.form label{font-size:11px;display:block;color:var(--muted);margin-bottom:5px}.form input,.form select{width:100%;background:#0b1826;border:1px solid #395166;color:var(--fg);border-radius:8px;padding:10px;min-height:41px}.note{border-left:3px solid var(--gold);padding:10px 13px;background:#192637;color:#e7dcc2;font-size:12px;line-height:1.65}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.battle{background:#10263a;border:1px solid #31536a;border-radius:13px;padding:16px;text-align:center}.battle .nm{color:var(--blue);font-weight:800;font-size:18px}.battle .score{font-weight:900;font-size:26px;margin:16px 0}.battle .extra{color:var(--muted);font-size:12px}.sep{color:var(--gold);font-size:23px;font-weight:900}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{font-size:12px;border:1px solid #3d5a70;border-radius:8px;padding:8px 10px;text-decoration:none}.links a:hover{background:#1c3951}.hide{display:none!important}.foot{font-size:11px;color:var(--muted);line-height:1.7;margin-top:24px}#notify{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#1b4854;padding:10px 22px;border:1px solid #64aeb3;border-radius:9px;display:none;z-index:2}.nowrap{white-space:nowrap}select{color-scheme:dark}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.two{grid-template-columns:1fr 1fr}.forms{grid-template-columns:repeat(2,1fr)}.shell{padding:15px 12px 55px}.head{align-items:start}.stamp{font-size:10px}}@media(max-width:480px){.grid,.two{grid-template-columns:1fr}.card,.panel{padding:14px}th,td{padding:9px 6px;font-size:12px}.brand h1{font-size:30px}.forms{grid-template-columns:1fr 1fr}} 
</style></head><body><div class="shell"><header class="head"><div class="brand"><small>世界ソシャゲ勢力調査</small><h1>ガチャ <b>ウォーズ</b></h1></div><div class="stamp">ソシャゲ勢力戦・総司令部<br><span id="stamp">記録データ表示</span></div></header><p class="intro">6作品 × 6市場を追跡するソシャゲ勢力戦。ランキングは市場・ストアごとに比較し、Steam・アップデートの動きも記録。<strong>実測していない数字は表示しない。</strong></p><nav class="nav" id="nav"></nav><main id="screen"></main><p class="foot">データの扱い：各数値には取得日・取得元を必須にしています。中国本土はiOSとAndroid各ストアを別扱い。App Storeの順位は売上金額ではありません。Steam同接はSteam経由の利用者のみ。入力済み履歴はこのブラウザのローカルストレージに保存され、他端末とは同期しません。© GACHA WARS — 非公式ゲーム市場分析サイト。</p></div><div id="notify"></div><script>
"use strict";
const G=[{id:"ww",name:"鳴潮",en:"Wuthering Waves",icon:"🌊",maker:"KURO GAMES",steam:"3513350"},{id:"gi",name:"ハラ",en:"Genshin Impact",icon:"🌠",maker:"HoYoverse",steam:null},{id:"hsr",name:"スタレ",en:"Honkai: Star Rail",icon:"🚂",maker:"HoYoverse",steam:null},{id:"zzz",name:"ゼンゼロ",en:"Zenless Zone Zero",icon:"⚡",maker:"HoYoverse",steam:"4162040"},{id:"nte",name:"NTE",en:"Neverness to Everness",icon:"🏙️",maker:"Hotta Studio",steam:"4508340"},{id:"end",name:"エンドフィールド",en:"Arknights: Endfield",icon:"🛰️",maker:"GRYPHLINE",steam:null}];
const R=[["jp","日本","jp"],["cn","中国本土","cn"],["tw","台湾","tw"],["hk","香港","hk"],["kr","韓国","kr"],["us","アメリカ","us"]];
const T=[["home","総司令部"],["rank","世界セルラン"],["steam","Steam戦場"],["duel","直接対決"],["update","アプデ決戦"],["record","ゲーム別戦績"],["power","勢力図ランキング"],["characters","キャラ別戦績"]];
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let records=[];try{records=JSON.parse(localStorage.getItem("gw-records-v1")||"[]");if(!Array.isArray(records))records=[]}catch{records=[]}
let youtubeStatus="未確認";let autoRecords=[];let feedStatus={steam:"読み込み中",ios:"読み込み中"};let iosMarketStatus={};let steamGameStatus={};
let characterFilter="all";let tab="home",region="jp",store="ios",game="ww",d1="ww",d2="nte",metric="rank",timewindow="30";
function changeCharacterFilter(id){characterFilter=id;render()}
function name(id){return G.find(g=>g.id===id)?.name||id}function date(){return new Date().toLocaleDateString("sv-SE")}function save(){localStorage.setItem("gw-records-v1",JSON.stringify(records))}function msg(t){$("notify").textContent=t;$("notify").style.display="block";setTimeout(()=>$("notify").style.display="none",2200)}
function latest(id,reg,kind,sub){return [...records,...autoRecords].filter(x=>x.game===id&&x.region===reg&&x.kind===kind&&x.store===sub).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function recs(id,kind){return [...records,...autoRecords].filter(x=>(!id||x.game===id)&&(!kind||x.kind===kind)).sort((a,b)=>b.date.localeCompare(a.date))}
function isFresh(r){if(!r)return false;const t=Date.parse(r.date);if(!Number.isFinite(t))return false;const age=Date.now()-t;return age>=-3600000&&age<=((r.kind==="steam"?12:36)*3600000)}
function rankLabel(r){return !r?'<span class="empty">未取得</span>':isFresh(r)?'#'+esc(r.value):'<span class="empty">旧記録 #'+esc(r.value)+'</span>'}
function fmt(r,suffix=""){return r?Number(r.value).toLocaleString("ja-JP")+suffix:"未取得"}function txt(r){return r?'<div class="tiny">'+(isFresh(r)?'観測':'古い記録')+' · '+esc(r.date)+' · '+esc(r.source)+'</div>':'<div class="tiny">未取得</div>'}
function opt(items,selected){return items.map(x=>'<option value="'+esc(x[0])+'" '+(x[0]===selected?'selected':'')+'>'+esc(x[1])+'</option>').join("")}
function sel(id,items,value,fn){return '<select id="'+id+'" onchange="'+fn+'(this.value)">'+opt(items,value)+'</select>'}
function go(x){tab=x;render()}function chreg(x){region=x;render()}function chstore(x){store=x;render()}function chgame(x){game=x;render()}function chduel(i,x){if(i===1)d1=x;else d2=x;render()}function chmetric(x){metric=x;render()}function chw(x){timewindow=x;render()}
function selectbar(){return '<div class="chips">'+R.map(r=>'<button class="pill '+(r[0]===region?'on':'')+'" onclick="chreg(\''+r[0]+'\')">'+r[1]+'</button>').join("")+'</div>'}
function storebar(){return '<div class="chips"><button class="pill '+(store==="ios"?"on":"")+'" onclick="chstore(\'ios\')">iOS App Store</button><button class="pill '+(store==="android"?"on":"")+'" onclick="chstore(\'android\')">Android（取得元別）</button></div>'}
function titleDiagnostics(){
const ios=R.map(x=>{const st=iosMarketStatus[x[0]];const when=st?.checked_at?Date.parse(st.checked_at):NaN;const fresh=Number.isFinite(when)&&Date.now()-when<36*3600000&&when-Date.now()<3600000;return '<tr><td>'+esc(x[1])+'</td><td>'+(st?(st.ok?'取得成功':'取得失敗'):'未取得')+(fresh?'':'（旧結果）')+'</td><td>'+(st?.ok?G.map(g=>st.matched?.includes(g.id)?'● '+g.name:'— '+g.name).join(' / '):esc(st?.error||'収集結果なし'))+'</td><td>'+esc(st?.checked_at||'—')+'</td></tr>'}).join("");
const steam=G.filter(g=>g.steam).map(g=>{const st=steamGameStatus[g.id];const r=latest(g.id,"global","steam","steam");return '<tr><td>'+g.icon+' '+esc(g.name)+'</td><td>'+(st?(st.ok?'API成功':'API失敗'):'詳細未取得')+'</td><td>'+(r?(isFresh(r)?Number(r.value).toLocaleString("ja-JP")+'人':'旧記録 '+r.value+'人'):'未取得')+'</td><td>'+esc(st?.checked_at||r?.date||'—')+'</td></tr>'}).join("");
return '<section class="panel"><h2>取得元別・詳細診断</h2><p class="hint">●は最新巡回で対象アプリと照合できたことを示します。—は圏外確定ではなく、名前照合できなかった場合も含みます。</p><details><summary style="cursor:pointer;font-weight:700">各市場の取得結果を開く</summary><div class="scroll"><table><thead><tr><th>市場</th><th>結果</th><th>6作品との照合</th><th>取得日時</th></tr></thead><tbody>'+ios+'</tbody></table></div></details><details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700">Steamの作品別取得結果を開く</summary><div class="scroll"><table><thead><tr><th>ゲーム</th><th>API結果</th><th>最終記録</th><th>取得日時</th></tr></thead><tbody>'+steam+'</tbody></table></div></details></section>'}
function collectionHealth(){const counts=[...autoRecords].filter(r=>Number.isFinite(Date.parse(r.date)));const latestKind=kind=>counts.filter(r=>r.kind===kind).sort((a,b)=>b.date.localeCompare(a.date))[0];const ios=latestKind("rank"),steam=latestKind("steam");const cells=[["iOSセルラン",ios,36],["Steam同時接続",steam,12]];return '<section class="panel"><h2>自動収集の稼働診断</h2><p class="hint">現在時刻から計算した取得データの経過時間。数値が古くなった場合、最新戦況には利用しません。</p><div class="two">'+cells.map(([title,r,limit])=>{const age=r?Math.max(0,(Date.now()-Date.parse(r.date))/3600000):null;const state=age===null?"記録なし":age<=limit?"取得記録あり":"更新停止の可能性";return '<div class="card"><b>'+title+'</b><div class="rank" style="margin:10px 0">'+state+'</div><div class="tiny">最終観測：'+(r?esc(r.date):"未取得")+'</div><div class="tiny">経過：'+(age===null?"不明":age.toFixed(1)+"時間")+' ／ 判定基準：'+limit+'時間</div></div>'}).join("")+'</div></section>'}
function sourceLinks(){return '<div class="links"><a target="_blank" rel="noopener" href="https://appcharts.nixmio.com/charts/'+region+'/top-grossing">当該市場のAppleランキング ↗</a><a target="_blank" rel="noopener" href="https://steamdb.info/">Steamの統計 ↗</a><a target="_blank" rel="noopener" href="https://sensortower.com/">売上分析サービス ↗</a></div>'}
function card(g){const a=latest(g.id,region,"rank","ios");return '<div class="game" onclick="game=\''+g.id+'\';go(\'record\')" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\')this.click()"><div class="ico">'+g.icon+'</div><span class="code">'+g.id.toUpperCase()+'</span><h3>'+g.name+'</h3><small>'+g.en+'</small><p class="tag">iOS '+R.find(r=>r[0]===region)[1]+' '+(a?(isFresh(a)?'#':'旧記録 #')+esc(a.value):'未取得')+'</p></div>'}
let releaseCandidates=[],candidateStatus={};
async function loadReleaseCandidates(){try{const r=await fetch("./release-candidates.json",{cache:"no-store"});if(!r.ok)throw Error("候補ファイル未取得");const j=await r.json();if(j.schema!=="gacha-wars-release-candidates-v1"||!Array.isArray(j.candidates))throw Error("形式不一致");releaseCandidates=j.candidates.filter(x=>G.some(g=>g.id===x.game)&&typeof x.title==="string"&&typeof x.url==="string"&&/^https:\/\//.test(x.url)).slice(0,100);candidateStatus=j.status||{};render()}catch(e){console.info("告知候補の取得失敗",e.message)}}
function releaseCandidateBoard(){const rows=releaseCandidates.slice(0,35);return '<section class="panel"><h2>公式告知の収集候補</h2><p class="hint">6作品の公式ニュース一覧から、更新・ガチャなどのキーワードを含むリンクを機械的に抽出。<b>内容・開催日・キャラ名は未確認</b>です。候補リンクは戦績集計に使いません。1日1回（日本時間17:10ごろ）取得を試行します。</p><div class="grid">'+G.map(g=>{const st=candidateStatus[g.id];return '<div class="card"><b>'+esc(g.name)+'</b><p class="tiny">'+(!st?'収集待ち':st.ok?'一覧の取得成功 / 候補 '+st.links_found+'件':'取得不可')+'</p></div>'}).join('')+'</div><div class="scroll"><table><thead><tr><th>作品</th><th>告知の見出し</th><th>状態</th><th>リンク</th></tr></thead><tbody>'+(rows.map(x=>'<tr><td>'+esc(name(x.game))+'</td><td>'+esc(x.title)+'</td><td>内容未確認</td><td><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">告知を確認 ↗</a></td></tr>').join('')||'<tr><td colspan="4" class="empty">候補収集は未実行、または条件に一致するリンクなし</td></tr>')+'</tbody></table></div></section>'}
function releaseCalendar(){const today=new Date(Date.now()+9*3600000).toISOString().slice(0,10);const upcoming=[...publishedEvents,...updateEvents].filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));const recent=[...publishedEvents,...updateEvents].filter(e=>e.date<today).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);const events=[...upcoming,...recent];return '<section class="panel"><h2>キャラ・アプデ予定表</h2><p class="hint">日付は日本時間の日付で管理。未到来のイベントは予定扱いです。運営サイトと外部報道は出典ラベルで区別します。</p><div class="scroll"><table><thead><tr><th>日付</th><th>作品・内容</th><th>区分</th><th>状態</th><th>情報元</th></tr></thead><tbody>'+(events.map(ev=>'<tr><td>'+esc(ev.date)+'</td><td><b>'+esc(name(ev.game))+'</b><div class="tiny">'+esc(ev.version)+'</div></td><td>'+phaseLabel(ev)+' / '+eventKindLabel(ev)+'</td><td>'+(ev.date>today?'予定':'日付到来')+'</td><td>'+eventVerification(ev)+' / '+eventSource(ev)+'</td></tr>').join('')||'<tr><td colspan="5">登録情報なし</td></tr>')+'</tbody></table></div></section>'}
function home(){let all=[...records,...autoRecords],n=all.length,l=all.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];return '<div class="stats"><div class="card stat"><label>監視ゲーム</label><strong>06</strong><em>タイトル固定</em></div><div class="card stat"><label>市場・地域</label><strong>06</strong><em>中国本土 / 台湾 / 香港は別</em></div><div class="card stat"><label>記録件数</label><strong>'+n+'</strong><em>手動＋自動収集の合計</em></div><div class="card stat"><label>最新記録</label><strong style="font-size:19px">'+(l?esc(l.date):'未取得')+'</strong><em>手動・自動記録を集計</em></div></div><section class="panel"><div class="row space"><div><h2>参戦タイトル</h2><p class="hint">タイトルをタップするとゲーム別戦績へ</p></div><span class="tag">6 GAMES</span></div>'+selectbar()+'<div class="grid">'+G.map(card).join("")+'</div></section><section class="panel"><h2>自動収集の状態</h2><div class="two"><div class="card"><b>セルラン</b><p class="hint">'+esc(feedStatus.ios)+'</p></div><div class="card"><b>Steam同接</b><p class="hint">'+esc(feedStatus.steam)+'</p></div></div><p class="hint">順位・同接は常に取得日時を確認。データ取得に失敗した場合も過去の数値を最新扱いしません。</p></section>'+collectionHealth()+titleDiagnostics()+'<section class="panel"><h2>戦況サマリー</h2><p class="hint">ランキングとSteamの実測記録を表示。古い観測値は旧記録として区別</p>'+tableRank("ios")+'</section>'+releaseCalendar() +releaseCandidateBoard()+'<section class="panel"><h2>計測元へのショートカット</h2>'+sourceLinks()+'</section>'}
function tableRank(sub){return '<div class="scroll"><table><thead><tr><th>ゲーム</th><th>'+R.find(r=>r[0]===region)[1]+' '+(sub==="ios"?"iOS":"Android")+'</th><th>出典・取得日</th></tr></thead><tbody>'+G.map(g=>{const r=latest(g.id,region,"rank",sub);return '<tr><td>'+g.icon+' <b>'+g.name+'</b></td><td class="rank">'+rankLabel(r)+'</td><td>'+txt(r)+'</td></tr>'}).join("")+'</tbody></table></div>'}
function worldMatrix(){
const last=R.map(r=>({r,market:iosMarketStatus[r[0]]||{}}));
const header=last.map(x=>'<th>'+esc(x.r[1])+'</th>').join("");

async function loadYoutube(){try{const response=await fetch("./youtube-data.json",{cache:"no-store"});if(!response.ok)throw Error("unavailable");const data=await response.json();if(data.schema!=="gacha-wars-youtube-v1"||!Array.isArray(data.records))throw Error("invalid data");youtubeStatus=data.status==="missing_api_key"?"APIキー未設定":data.status==="not_run"?"未実行":data.status==="ok"?"取得処理完了":data.status==="fetch_failed"?"API取得失敗":data.status||"未確認";const items=data.records.filter(r=>G.some(g=>g.id===r.game)&&r.kind==="sns"&&r.store==="youtube"&&r.region==="global"&&Number.isSafeInteger(r.value)&&r.value>=0&&typeof r.date==="string"&&typeof r.source==="string");autoRecords=[...autoRecords.filter(r=>!(r.kind==="sns"&&r.store==="youtube")),...items];render()}catch(err){youtubeStatus="データ読込失敗";render()}}
async function loadEvents(){try{const response=await fetch("./release-events.json",{cache:"no-store"});if(!response.ok)throw Error("unavailable");const data=await response.json();if(data.schema!=="gacha-wars-releases-v1"||!Array.isArray(data.events))throw Error("invalid schema");publishedEvents=data.events.filter(x=>G.some(g=>g.id===x.game)&&["version","character"].includes(x.type)&&typeof x.version==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.source_url==="string"&&/^https:\/\//.test(x.source_url)).map(x=>({...x,published:true}));releaseFeedStatus="読込成功（"+publishedEvents.length+"/"+data.events.length+"件）";render()}catch(err){releaseFeedStatus="取得失敗: "+err.message;render();console.info("リリース日データ未取得",err.message)}}
async function loadSteam(){try{const response=await fetch("./steam-data.json",{cache:"no-store"});if(!response.ok)throw Error("unavailable");const data=await response.json();if(data.schema!=="gacha-wars-steam-v1"||!Array.isArray(data.records))throw Error("invalid schema");steamGameStatus=data.game_status||{};feedStatus.steam="読込成功 / "+data.records.length+"件 / 最終更新 "+(data.updated_at||"未実行");autoRecords=[...autoRecords.filter(r=>r.kind!=="steam"),...data.records.filter(r=>G.some(g=>g.id===r.game&&g.steam)&&r.kind==="steam"&&r.region==="global"&&r.store==="steam"&&Number.isSafeInteger(r.value)&&r.value>=0&&typeof r.date==="string"&&typeof r.source==="string")];render()}catch(err){feedStatus.steam="取得不可: "+err.message;render();console.info("Steam自動記録は未取得",err.message)}}
async function loadIos(){try{const response=await fetch("./ios-rank-data.json",{cache:"no-store"});if(!response.ok)throw Error("unavailable");const data=await response.json();if(data.schema!=="gacha-wars-ios-v1"||!Array.isArray(data.records))throw Error("invalid schema");iosMarketStatus=data.market_status||{};feedStatus.ios="読込成功 / "+data.records.length+"件 / 最終更新 "+(data.updated_at||"未実行");const current=data.records.filter(r=>G.some(g=>g.id===r.game)&&R.some(x=>x[0]===r.region)&&r.kind==="rank"&&r.store==="ios"&&Number.isSafeInteger(r.value)&&r.value>0&&typeof r.date==="string"&&Number.isFinite(Date.parse(r.date))&&typeof r.source==="string");const unique=[...new Map(current.map(r=>[[r.game,r.region,r.store,r.date].join("|"),r])).values()];autoRecords=[...autoRecords.filter(r=>r.kind!=="rank"),...unique];render()}catch(err){feedStatus.ios="取得不可: "+err.message;render();console.info("iOS自動記録は未取得",err.message)}}
function render(){$("nav").innerHTML=T.map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join("");$("screen").innerHTML=({home,rank,steam,sns,duel,update:updates,record,power,characters:characterRanking}[tab])();$("stamp").textContent="手動 "+records.length+"件・自動 "+autoRecords.length+"件 / "+date()}
render();loadSteam();loadIos();loadYoutube();loadEvents();loadReleaseCandidates();
</script></body></html>
