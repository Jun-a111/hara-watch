name: Update GACHA WARS YouTube

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5,11,17,23 * * *'
  push:
    paths:
      - 'scripts/update_gacha_youtube.py'
      - '.github/workflows/gacha-youtube.yml'

permissions:
  contents: write

concurrency:
  group: gacha-wars-youtube
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync latest archive
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official video stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_gacha_youtube.py
      - name: Commit safe statistics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gacha-wars/youtube-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GACHA WARS YouTube observations"
            git pull --rebase
            git push
          fi
