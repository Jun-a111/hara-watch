name: ガチャウォーズ・公式告知候補収集
on:
  schedule:
    - cron: '10 8 * * *'
    - cron: '10 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_gacha_releases.py'
      - 'tests/test_gacha_releases.py'
      - '.github/workflows/gacha-releases.yml'
permissions:
  contents: write
concurrency:
  group: gacha-releases
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 収集スクリプト構文検査
        run: python -m py_compile scripts/update_gacha_releases.py
      - name: 公式告知収集の回帰テスト
        run: |
          python -m unittest discover -s tests -p "test_gacha_releases.py" -v 2>&1 | tee gacha-release-tests.log
          exit ${PIPESTATUS[0]}
      - name: テスト結果をActions概要に記録
        if: always()
        run: |
          {
            echo '## 公式告知の回帰テスト'
            if [ -f gacha-release-tests.log ]; then
              grep -E '^Ran [0-9]+ tests|^OK$|^FAILED' gacha-release-tests.log || true
            else
              echo 'テストログなし'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 現在の候補JSONの検証
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("gacha-wars/release-candidates.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["schema"]=="gacha-wars-release-candidates-v1"
          assert isinstance(d["candidates"],list)
          print("Saved candidates:",len(d["candidates"]),"updated:",d.get("updated_at"))
          PY
      - name: 検証失敗時のテストログ保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gacha-release-test-failure
          path: gacha-release-tests.log
          if-no-files-found: warn
          retention-days: 7
  collect:
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 収集スクリプト単独の構文検査
        run: python -m py_compile scripts/update_gacha_releases.py
      - name: ブラウザ解析を準備
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); print('Chromium起動成功:', b.version); b.close(); p.stop()"
      - name: Playwright本文取得APIの動作確認
        run: |
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); page=b.new_page(); page.set_content('<main>公式告知テスト本文</main>'); assert page.locator('main, article').all_text_contents()==['公式告知テスト本文']; print('Playwright 本文取得成功'); b.close(); p.stop()"
      - name: 公式告知の候補リンクを集める
        run: |
          set +e
          timeout 14m python -u scripts/update_gacha_releases.py 2>&1 | tee gacha-release-collector.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then echo "収集が途中終了（終了コード $rc）。チェックポイントの保存を試みます。"; fi
          exit "$rc"
      - name: 収集結果の診断を出力
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("gacha-wars/release-candidates.json")
          if p.exists():
              d=json.loads(p.read_text(encoding="utf-8"))
              print("収集日時",d.get("updated_at"))
              for game,status in d.get("status",{}).items():
                  print(game,"発見",status.get("browser_links_found"),"詳細",status.get("browser_diagnostics"),"失敗",status.get("browser_index_error"))
          PY
      - name: 収集診断ファイルを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gacha-release-diagnostics
          path: |
            gacha-release-collector.log
            gacha-wars/release-candidates.json
          if-no-files-found: warn
          retention-days: 7
      - name: 候補一覧を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other workflows may update the same JSON while collection is running.
          # Rebase on the latest main and merge by article URL instead of overwriting it.
          cp gacha-wars/release-candidates.json /tmp/gacha-release-collected.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("gacha-wars/release-candidates.json")
          latest=json.loads(p.read_text(encoding="utf-8"))
          collected=json.loads(Path("/tmp/gacha-release-collected.json").read_text(encoding="utf-8"))
          merged={}
          for record in latest.get("candidates",[]):
              if isinstance(record,dict) and record.get("url"):
                  merged[(record.get("game"),record["url"])]=record
          for record in collected.get("candidates",[]):
              if not isinstance(record,dict) or not record.get("url"):continue
              key=(record.get("game"),record["url"])
              old=merged.get(key,{})
              fresh=dict(old)
              fresh.update(record)
              if old.get("body_status") in ("rendered","extracted") and fresh.get("body_status") not in ("rendered","extracted"):
                  for field in ("date_candidates","date_context","body_status","period_candidates","character_candidates","extraction_version","phase_hint"):
                      if field in old:fresh[field]=old[field]
              previous_periods={(x.get("start_raw"),x.get("end_raw")):x for x in old.get("period_candidates",[]) if isinstance(x,dict)}
              for period in fresh.get("period_candidates",[]):
                  if not isinstance(period,dict):continue
                  earlier=previous_periods.get((period.get("start_raw"),period.get("end_raw")))
                  if earlier and earlier.get("classification_source") in ("stored_context_reclassified","convene_notice_context"):
                      if period.get("classification") in (None,"unknown","other_event"):
                          period["classification"]=earlier.get("classification")
                          period["classification_source"]=earlier["classification_source"]
              merged[key]=fresh
          latest["candidates"]=list(merged.values())[:400]
          latest["status"]=collected.get("status",latest.get("status",{}))
          latest["updated_at"]=collected.get("updated_at",latest.get("updated_at"))
          p.write_text(json.dumps(latest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          json.loads(p.read_text(encoding="utf-8"))  # Verify saved JSON before committing
          PY
            git add gacha-wars/release-candidates.json
            if git diff --cached --quiet; then
              echo "候補データに変更なし"
              break
            fi
            git commit -m "Update official news link candidates"
            if git push origin HEAD:main; then
              echo "収集結果を競合なく保存"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::5回試行しても保存できませんでした"
              exit 1
            fi
          done
