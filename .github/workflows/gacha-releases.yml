name: ガチャウォーズ・公式告知候補収集
on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_gacha_releases.py'
      - '.github/workflows/gacha-releases.yml'
permissions:
  contents: write
concurrency:
  group: gacha-releases
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ブラウザ解析を準備
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); print('Chromium起動成功:', b.version); b.close(); p.stop()"
      - name: 収集コードの構文チェック
        run: python -m py_compile scripts/update_gacha_releases.py
      - name: 開催期間・キャラ名の抽出テスト
        run: python -m unittest discover -s tests -p "test_gacha_releases.py" -v
      - name: 公式告知の候補リンクを集める
        run: python scripts/update_gacha_releases.py
      - name: 候補一覧を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gacha-wars/release-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official news link candidates"
            git pull --rebase
            git push
          fi
