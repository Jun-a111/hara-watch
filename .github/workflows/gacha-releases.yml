name: ガチャウォーズ・公式告知候補収集
on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_gacha_releases.py'
      - '.github/workflows/gacha-releases.yml'
permissions:
  contents: write
concurrency:
  group: gacha-releases
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ブラウザ解析を準備
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); print('Chromium起動成功:', b.version); b.close(); p.stop()"
      - name: Playwright本文取得APIの動作確認
        run: |
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); page=b.new_page(); page.set_content('<main>公式告知テスト本文</main>'); assert page.locator('main, article').all_text_contents()==['公式告知テスト本文']; print('Playwright 本文取得成功'); b.close(); p.stop()"
      - name: 収集コードの構文チェック
        run: python -m py_compile scripts/update_gacha_releases.py
      - name: 開催期間・キャラ名の抽出テスト
        run: python -m unittest discover -s tests -p "test_gacha_releases.py" -v
      - name: 公式告知の候補リンクを集める
        run: timeout 14m python -u scripts/update_gacha_releases.py || echo "収集が途中終了。保存済みチェックポイントを確認します。"
      - name: 収集結果の診断を出力
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("gacha-wars/release-candidates.json")
          if p.exists():
              d=json.loads(p.read_text(encoding="utf-8"))
              print("収集日時",d.get("updated_at"))
              for game,status in d.get("status",{}).items():
                  print(game,"発見",status.get("browser_links_found"),"詳細",status.get("browser_diagnostics"),"失敗",status.get("browser_index_error"))
          PY
      - name: 候補一覧を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gacha-wars/release-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official news link candidates"
            git pull --rebase
            git push
          fi
