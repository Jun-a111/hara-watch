name: ガチャウォーズ・公式告知候補収集
on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_gacha_releases.py'
      - '.github/workflows/gacha-releases.yml'
permissions:
  contents: write
concurrency:
  group: gacha-releases
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 公式告知の候補リンクを集める
        run: python scripts/update_gacha_releases.py
      - name: 候補一覧を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gacha-wars/release-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official news link candidates"
            git pull --rebase
            git push
          fi
