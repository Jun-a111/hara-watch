name: Update GACHA WARS Steam

on:
  schedule:
    - cron: '35 5,11,17,23 * * *'
  push:
    paths:
      - 'scripts/update_gacha_steam.py'
      - '.github/workflows/gacha-steam.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gacha-wars-steam
  cancel-in-progress: false

jobs:
  steam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official Steam player counts
        run: python scripts/update_gacha_steam.py
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gacha-wars/steam-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GACHA WARS Steam snapshots"
            git pull --rebase
            git push
          fi
