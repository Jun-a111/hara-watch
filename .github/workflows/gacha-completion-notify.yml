name: ガチャウォーズ・収集完了通知

on:
  workflow_run:
    workflows:
      - ガチャウォーズ・公式告知候補収集
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub通知用のIssueに完了結果を投稿
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          owner, repo = os.environ["GH_REPOSITORY"].split("/", 1)
          root = f"https://api.github.com/repos/{owner}/{repo}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  root + path, data=data, headers=headers,
                  method="POST" if payload is not None else "GET",
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  return json.load(response)

          title = "ガチャウォーズ：公式告知収集の完了通知"
          result = os.environ["RUN_RESULT"]
          label = "成功" if result == "success" else f"終了（{result}）"
          body = (
              f"@{owner} ガチャウォーズの公式告知収集が**{label}**しました。\n\n"
              f"実行結果: {os.environ['RUN_URL']}\n"
              f"Run ID: {os.environ['RUN_ID']}\n\n"
              "通知が届かない場合は、このIssueのSubscribeとGitHubの通知設定を確認してください。"
          )
          issues = api("/issues?state=open&per_page=100")
          existing = next(
              (item for item in issues if item.get("title") == title and "pull_request" not in item), None
          )
          if existing:
              api(f"/issues/{existing['number']}/comments", {"body": body})
              print(f"Notification posted to issue #{existing['number']}")
          else:
              created = api("/issues", {"title": title, "body": body, "assignees": [owner]})
              print(f"Notification issue created: {created['html_url']}")
          PY
