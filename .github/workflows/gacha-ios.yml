name: ガチャウォーズ・iOS順位自動収集

on:
  schedule:
    - cron: '30 5,11,17,23 * * *'
  push:
    paths:
      - 'scripts/update_gacha_ios.py'
      - '.github/workflows/gacha-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gacha-wars-ios
  cancel-in-progress: false

jobs:
  ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 最新の順位履歴を取得
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: iOSセルランを取得
        run: python scripts/update_gacha_ios.py
      - name: 収集結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gacha-wars/ios-rank-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GACHA WARS iOS observations"
            git pull --rebase
            git push
          fi
