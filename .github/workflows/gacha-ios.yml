name: Update GACHA WARS iOS charts

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gacha-wars-ios
  cancel-in-progress: false

jobs:
  ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch iOS top grossing game charts
        run: python scripts/update_gacha_ios.py
      - name: Commit chart observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gacha-wars/ios-rank-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GACHA WARS iOS observations"
            git pull --rebase
            git push
          fi
